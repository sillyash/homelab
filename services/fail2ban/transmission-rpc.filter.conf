# Originally written for Transmission's RPC login prompt; Jellyseerr also answers
# a failed login with a plain 401, so this same filter/jail covers it too with no
# changes needed. Jellyfin/dropservice don't return HTTP 401. Sonarr/Radarr/
# Prowlarr/Bazarr answer failed logins differently (302 or 403) and are covered
# by the separate arr-login filter/jail instead.
[Definition]
failregex = ^<HOST> -.*"(GET|POST) \S+ HTTP/\d\.\d" 401
ignoreregex =
