# Sonarr/Radarr/Prowlarr answer a bad login with 302 + Location:
# /login?returnUrl=&loginFailed=true (not 401), so the generic
# transmission-rpc filter can't see it. Requires nginx's arr_auth log
# format (services/nginx/conf.d/log-formats.conf) to expose the Location
# header via $sent_http_location. Bazarr answers a bad login with a plain
# 403 on POST /api/system/account, matched separately below.
[Definition]
failregex = ^<HOST> -.*"POST \S*/login HTTP/\d\.\d" \d+ "[^"]*loginFailed=true"
            ^<HOST> -.*"POST \S*/api/system/account HTTP/\d\.\d" 403
ignoreregex =
