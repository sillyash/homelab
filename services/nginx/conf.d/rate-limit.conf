# Rate limiting for the publicly-exposed Transmission RPC/web UI, to blunt
# bots hammering the login prompt. See services/transmission/README.md.
limit_req_zone $binary_remote_addr zone=transmission_rpc:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=transmission_conn:10m;

# Same idea for the arr-stack apps' login endpoints (Sonarr/Radarr/Prowlarr
# /login, Bazarr /api/system/account). See services/nginx/sites-available/arr-stack.
limit_req_zone $binary_remote_addr zone=arr_login:10m rate=5r/m;
