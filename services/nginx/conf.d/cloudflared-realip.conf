# Requests arriving through the Cloudflare Tunnel come from cloudflared on
# 127.0.0.1 — trust its CF-Connecting-IP header so $remote_addr (logs,
# limit_req zones, X-Real-IP) is the real client. Only localhost is trusted,
# so direct clients on public 443 can't spoof it.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header   CF-Connecting-IP;
