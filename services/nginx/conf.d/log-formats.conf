# Captures the response's Location header so fail2ban can see failed-login
# redirects from Sonarr/Radarr/Prowlarr (they respond 302 with
# "loginFailed=true" in the Location, not 401, on bad credentials).
# See services/fail2ban/arr-login.filter.conf.
log_format arr_auth '$remote_addr - [$time_local] "$request" $status "$sent_http_location"';
